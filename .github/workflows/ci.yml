name: ci

on:
  push:
    branches: [mobilenode, main, dex, "m[0-9]*", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Contrast gate
        run: python3 -I design/check-contrast.py
      - name: Theme generator
        run: python3 -I design/gen-theme.py --out "$RUNNER_TEMP/theme"
      - name: Locales
        run: python3 -I tools/check-locales.py .
      - name: Randomness sources
        run: python3 -I tools/check-rng.py
      - name: Version scheme
        run: python3 -I tools/version.py --selftest
      - name: Build script tests
        run: bash native-build/tests/test-fetch-core.sh
      - name: Helper release tag selection
        run: bash native-build/tests/test-fetch-helpers.sh

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Peer country database
        run: bash tools/fetch-geoip.sh
      - name: Build both flavors
        run: gradle --no-daemon :app:assembleMainnetDebug :app:assembleTnetDebug
      - name: Node binary for the integration tests
        continue-on-error: true
        run: |
          set -euo pipefail
          url=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/bartman081523/elektron-net/releases?per_page=30" \
            | python3 -c "import json,sys;print(next((a['browser_download_url'] for r in json.load(sys.stdin) for a in r.get('assets',[]) if a['name'].startswith('elektron-net-linux-') and a['name'].endswith('.tar.gz')),''))")
          if [ -z "$url" ]; then
            echo "no Linux node asset in the fork's releases, the integration tests stay skipped"
            exit 0
          fi
          # the node links libevent/sqlite/boost dynamically
          sudo apt-get install -y --no-install-recommends libevent-dev libsqlite3-dev
          mkdir -p "$RUNNER_TEMP/node"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/node" --strip-components=1
          chmod +x "$RUNNER_TEMP/node/elektrond" "$RUNNER_TEMP/node/elektron-cli"
          "$RUNNER_TEMP/node/elektrond" --version
          echo "ELEKTROND_BIN=$RUNNER_TEMP/node/elektrond" >> "$GITHUB_ENV"

      - name: Unit tests and lint for both flavors
        # --rerun-tasks: the build cache would otherwise replay test results that
        # were recorded without ELEKTROND_BIN, i.e. with the integration tests skipped
        run: gradle --no-daemon --rerun-tasks :app:testMainnetDebugUnitTest :app:testTnetDebugUnitTest :app:lintMainnetDebug :app:lintTnetDebug
      - name: Lint details
        if: failure()
        run: grep -h -A3 "Error:" app/build/reports/lint-results-*.txt app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt 2>/dev/null | head -150 || true
